project_id = "parking-comunidad"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "https://alanmulloa.github.io/parking-scanner/"
additional_redirect_urls = ["http://localhost:3000", "http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = false

[functions.legacy-auth-migrate]
verify_jwt = false
