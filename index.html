<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Escáner QR · Parking Comunidad</title>
  <style>
    :root{--bg:#f4f7f8;--surface:#fff;--ink:#152729;--muted:#617276;--brand:#087f6b;--dark:#0d302f;--danger:#b42318;--line:#dce5e6}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif}
    main{width:min(680px,calc(100% - 1rem));margin:0 auto;padding:1rem 0 2rem}.hero{background:linear-gradient(135deg,var(--dark),var(--brand));color:#fff;border-radius:20px;padding:1.4rem;margin-bottom:1rem}.hero h1{margin:0 0 .35rem}.hero p{margin:0;color:#d7f0eb}
    .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:1rem}.message{padding:.8rem 1rem;border-radius:10px;background:#e1f2ef;color:#086b5b;margin:.8rem 0}.bad{background:#fee4e2;color:var(--danger)}button{border:0;border-radius:12px;background:var(--brand);color:#fff;padding:.8rem 1rem;font-weight:750;cursor:pointer;width:100%;font-size:1rem}.muted{color:var(--muted)}#reader{width:100%;overflow:hidden;border-radius:12px}#reader video{border-radius:12px}#fallback{display:none;margin-top:1rem}
  </style>
</head>
<body>
<main>
  <section class="hero"><h1>Escáner QR</h1><p>Parking Comunidad</p></section>
  <section class="card">
    <div id="status" class="message">Iniciando cámara…</div>
    <div id="reader"></div>
    <button id="fallback" type="button">▣ ABRIR CÁMARA</button>
    <p class="muted" style="font-size:.85rem">Apunta al QR. Al detectarlo, volverás automáticamente a Parking Comunidad con el resultado.</p>
  </section>
</main>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
let scanner=null,done=false,starting=false;
const status=document.getElementById('status');
const fallback=document.getElementById('fallback');
function show(msg,bad=false){status.textContent=msg;status.className='message'+(bad?' bad':'')}
function validParkingUrl(text){
  try{const u=new URL(text);return u.protocol==='https:'&&u.searchParams.has('q')}catch(e){return false}
}
async function stop(){if(scanner){try{await scanner.stop()}catch(e){}try{scanner.clear()}catch(e){}scanner=null}}
async function start(){
  if(done||starting)return;
  starting=true;fallback.style.display='none';show('Solicitando permiso de cámara…');
  try{
    if(typeof Html5Qrcode==='undefined')throw new Error('No se pudo cargar el lector QR.');
    scanner=new Html5Qrcode('reader');
    await scanner.start({facingMode:'environment'},{fps:12,qrbox:(w,h)=>{const s=Math.floor(Math.min(w,h)*.72);return{width:s,height:s}},aspectRatio:1.333},async text=>{
      if(done)return;
      if(!validParkingUrl(text)){show('El QR leído no contiene un enlace válido de Parking Comunidad.',true);return}
      done=true;navigator.vibrate?.(100);show('QR detectado. Volviendo a Parking Comunidad…');await stop();window.location.href=text;
    },()=>{});
    show('Apunta al QR y mantenlo dentro del recuadro.');
  }catch(e){
    await stop();
    show('No se pudo iniciar la cámara automáticamente. Pulsa “ABRIR CÁMARA” y revisa el permiso si el navegador lo solicita.',true);
    fallback.style.display='block';
  }finally{starting=false}
}
fallback.addEventListener('click',start);
window.addEventListener('pagehide',()=>{stop()});
window.addEventListener('load',()=>{setTimeout(start,150)});
</script>
</body>
</html>
